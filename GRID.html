<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRID</title>
</head>
<body style="padding-bottom: 1000px ;">
    <div style="display: grid;grid-template-columns: 1fr 1fr 1fr; margin-top: 30px; column-gap: 30px ; row-gap: 30px;">  
        <div style="background-color: yellow; height: 200px;">div1</div>
        <div style="background-color: green;">div2</div>
        <div style="background-color: blue; color: white;">div3</div>
        <div style="background-color: green; height: 200px;">div4</div>
        <div style="background-color: blue;">div5</div>
        <div style="background-color: yellow; color: white;">div6</div>
    </div>
</body>
</html>
